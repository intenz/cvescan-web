<header class="cves-header">
  <a class="cves-header__brand" routerLink="/">
    <span class="cves-header__logo">CVEScan</span>
    <span class="cves-header__sub">/ Free Runtime Scanner</span>
  </a>

  <div class="cves-header__modes">
    <nav class="cves-header__nav" aria-label="Scan mode">
      @for (m of modes; track m.id) {
        @if (m.available) {
          <a
            class="cves-header__nav-item"
            [routerLink]="modeHref(m.id)"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: m.id === 'local' }"
            [title]="m.description"
          >
            {{ m.label }}
          </a>
        } @else {
          <button
            type="button"
            class="cves-header__nav-item is-soon"
            disabled
            [title]="m.description"
          >
            {{ m.label }}
            <span>soon</span>
          </button>
        }
      }
    </nav>
  </div>

  <div class="cves-header__right">
    <button
      type="button"
      class="cves-header__live"
      [attr.aria-label]="liveLabel() + '. ' + liveUpdatedLabel()"
      (click)="openDataSources()"
    >
      <i aria-hidden="true"></i>
      <span class="cves-header__live-slot" [style.width.ch]="liveSlotCh">
        @for (label of [liveLabel()]; track feedIndex()) {
          <span class="cves-header__live-text">{{ label }}</span>
        }
      </span>
      <span class="cves-header__live-q" aria-hidden="true">?</span>
      <span class="cves-header__live-tip" role="tooltip">
        <span class="cves-header__live-tip-desc">{{ activeFeed().description }}</span>
        <span class="cves-header__live-tip-time">{{ liveUpdatedLabel() }}</span>
      </span>
    </button>
    <cves-theme-toggle />
    <a class="cves-header__link" routerLink="/faq" routerLinkActive="is-active" title="FAQ">
      <svg class="cves-header__faq-icon" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path
          d="M5.7 6.1c0-1.2.9-2.05 2.15-2.05S10 4.95 10 6c0 .85-.45 1.35-1.2 1.8-.6.35-.85.65-.85 1.25v.2"
          fill="none"
          stroke="currentColor"
          stroke-width="1.35"
          stroke-linecap="round"
        />
        <circle cx="8" cy="11.35" r="0.85" fill="currentColor"/>
      </svg>
      FAQ
    </a>
    <a
      class="cves-header__discord"
      [href]="discordUrl"
      target="_blank"
      rel="noopener noreferrer"
      title="Discord — bugs, ideas &amp; community"
      aria-label="Join Discord for bugs, ideas, and community"
    >
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <path
          fill="currentColor"
          d="M13.1 3.1A11.4 11.4 0 0 0 10.3 2c-.1.3-.3.6-.4.9a10.5 10.5 0 0 0-3.8 0A7 7 0 0 0 5.7 2 11.3 11.3 0 0 0 2.9 3.1C1.3 5.6.9 8 1.1 10.4A11.5 11.5 0 0 0 4.6 12c.3-.4.5-.8.7-1.2-.4-.1-.7-.3-1.1-.5.1-.1.2-.1.3-.2a8.3 8.3 0 0 0 7 0l.3.2c-.3.2-.7.4-1.1.5.2.4.4.8.7 1.2a11.5 11.5 0 0 0 3.5-1.6c.2-2.6-.4-5-1.8-7.3ZM6.1 9.1c-.7 0-1.2-.6-1.2-1.3S5.4 6.5 6.1 6.5s1.3.6 1.2 1.3-.5 1.3-1.2 1.3Zm3.8 0c-.7 0-1.2-.6-1.2-1.3s.5-1.3 1.2-1.3 1.3.6 1.2 1.3-.5 1.3-1.2 1.3Z"
        />
      </svg>
    </a>
    <button
      type="button"
      class="cves-header__donate"
      title="Support CVEScan"
      aria-label="Support CVEScan"
      (click)="openDonate()"
    >
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path
          d="M8 13.5S2.5 10.2 2.5 6.4A2.9 2.9 0 0 1 8 4.8a2.9 2.9 0 0 1 5.5 1.6C13.5 10.2 8 13.5 8 13.5z"
          fill="currentColor"
          fill-opacity="0.92"
        />
      </svg>
    </button>
    <a
      class="cves-header__api"
      routerLink="/external-api"
      routerLinkActive="is-active"
      title="Commercial CPE → CVE API"
    >
      External API
      <span class="cves-header__api-star" aria-label="Featured">★</span>
    </a>
  </div>
</header>
