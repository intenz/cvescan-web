<ol class="cves-wizard">
  @for (step of steps; track step; let i = $index) {
    <li
      [class.is-done]="isDone(i)"
      [class.is-current]="isCurrent(i)"
    >
      <span class="cves-wizard__num">
        @if (isDone(i)) {
          ✓
        } @else {
          {{ i + 1 }}
        }
      </span>
      {{ step }}
      @if (!$last) {
        <span class="cves-wizard__arrow">→</span>
      }
    </li>
  }
</ol>
