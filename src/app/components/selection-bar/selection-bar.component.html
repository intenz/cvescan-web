<footer class="cves-selection">
  <div class="cves-selection__stats">
    Selected: {{ stats().count }}
    <span>| {{ stats().critical }} critical | {{ stats().high }} high | avg {{ stats().avg }} cvss</span>
  </div>
  <div class="cves-selection__actions">
    <button type="button" (click)="exportCsv()">Export CSV</button>
    <button type="button" class="cves-selection__report" disabled title="Coming soon">
      Generate Report
    </button>
  </div>
</footer>
