<section class="cves-site" [class.is-compact]="compact()">
  <form class="cves-site__form" (submit)="$event.preventDefault(); submit()">
    @if (!compact()) {
      <label class="cves-site__label" [attr.for]="inputId()">Website</label>
    }
    <div class="cves-site__row">
      <input
        [id]="inputId()"
        type="url"
        name="url"
        placeholder="https://example.com"
        autocomplete="url"
        [ngModel]="url()"
        (ngModelChange)="url.set($event)"
        [disabled]="busy()"
        [attr.aria-label]="compact() ? 'Website URL' : null"
      />
      <button type="submit" [disabled]="busy() || !url().trim()">
        {{ busy() ? 'Scanning…' : 'Scan site' }}
      </button>
      @if (canDownload()) {
        <cves-download-report />
      }
    </div>
  </form>
  <p class="cves-site__hint">
    @if (compact()) {
      Probe another public URL here — no need to expand the steps.
    } @else {
      Need a public <code>https://</code> URL. We probe headers, HTML, DNS/TLS — no login, no private pages.
    }
  </p>
  @if (state.error(); as err) {
    <p class="cves-site__error">{{ err }}</p>
  }
</section>
