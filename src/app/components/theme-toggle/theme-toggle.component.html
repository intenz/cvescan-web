<div class="cves-theme" role="group" aria-label="Theme">
  @for (mode of modes; track mode) {
    <button
      type="button"
      [class.is-active]="theme.mode() === mode"
      [attr.aria-label]="label(mode)"
      [attr.title]="label(mode)"
      (click)="theme.setMode(mode)"
    >
      @switch (mode) {
        @case ('dark') {
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path
              fill="currentColor"
              d="M6.2 1.4a6.5 6.5 0 0 0 8.4 8.4A6.6 6.6 0 1 1 6.2 1.4z"
            />
          </svg>
        }
        @case ('light') {
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <circle cx="8" cy="8" r="3.1" fill="currentColor" />
            <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M8 1.4v1.6M8 13v1.6M1.4 8h1.6M13 8h1.6M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1" />
            </g>
          </svg>
        }
        @default {
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <rect
              x="2.2"
              y="2.5"
              width="11.6"
              height="8.2"
              rx="1.2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.35"
            />
            <path
              d="M5.5 13.2h5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.35"
              stroke-linecap="round"
            />
          </svg>
        }
      }
    </button>
  }
</div>
