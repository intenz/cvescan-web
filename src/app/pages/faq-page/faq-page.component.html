<section class="cves-faq-page">
  <header class="cves-faq-page__head">
    <img
      class="cves-faq-page__icon"
      src="faq-icon.svg"
      width="40"
      height="40"
      alt=""
    />
    <div>
      <h1>{{ page.h1 }}</h1>
      <p class="cves-faq-page__lead">{{ page.lead }}</p>
    </div>
  </header>

  <div class="cves-faq-page__list">
    @for (item of faq; track item.question) {
      <details class="cves-faq-page__item">
        <summary>{{ item.question }}</summary>
        <p>{{ item.answer }}</p>
      </details>
    }
  </div>

  <aside class="cves-faq-page__discord" aria-labelledby="cves-faq-discord-title">
    <div class="cves-faq-page__discord-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="36" height="36">
        <path
          fill="currentColor"
          d="M19.7 4.6A17.1 17.1 0 0 0 15.5 3c-.2.4-.4.9-.6 1.3a15.7 15.7 0 0 0-5.8 0A9.5 9.5 0 0 0 8.5 3 17 17 0 0 0 4.3 4.6C1.9 8.4 1.3 12 1.6 15.6A17.3 17.3 0 0 0 6.9 18c.4-.6.8-1.2 1.1-1.8-.6-.2-1.1-.5-1.6-.8.1-.1.3-.2.4-.3a12.5 12.5 0 0 0 10.4 0l.4.3c-.5.3-1 .6-1.6.8.3.6.7 1.2 1.1 1.8a17.3 17.3 0 0 0 5.3-2.4c.4-3.9-.6-7.5-2.7-11ZM9.1 13.6c-1 0-1.9-.9-1.9-2s.8-2 1.9-2 1.9.9 1.9 2-.8 2-1.9 2Zm5.8 0c-1 0-1.9-.9-1.9-2s.8-2 1.9-2 1.9.9 1.9 2-.9 2-1.9 2Z"
        />
      </svg>
    </div>
    <div class="cves-faq-page__discord-body">
      <h2 id="cves-faq-discord-title">{{ discordTitle }}</h2>
      <p>{{ discordBody }}</p>
      <a
        class="cves-faq-page__discord-cta"
        [href]="discordUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ discordCta }}
      </a>
    </div>
  </aside>

  <p class="cves-faq-page__back">
    <a routerLink="/">← Back to scanner</a>
    ·
    <a routerLink="/external-api">External API</a>
  </p>

</section>
