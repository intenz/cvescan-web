<section class="cves-scan">
  <h1 class="cves-scan__title">{{ home.h1 }}</h1>
  <p class="cves-scan__tagline">{{ home.tagline }}</p>

  <div class="cves-scan__strip" [class.is-collapsed]="state.stripCollapsed()">
    <div class="cves-scan__strip-head">
      <cves-scan-wizard />
      <button
        type="button"
        class="cves-scan__collapse"
        (click)="state.toggleStrip()"
        [attr.aria-expanded]="!state.stripCollapsed()"
        [attr.aria-label]="state.stripCollapsed() ? 'Expand scan setup' : 'Collapse scan setup'"
      >
        <span class="cves-scan__collapse-icon" aria-hidden="true">▾</span>
        {{ state.stripCollapsed() ? 'Expand' : 'Collapse' }}
      </button>
    </div>

    <div class="cves-scan__strip-body" [class.is-collapsed]="state.stripCollapsed()">
      <div class="cves-scan__strip-body-inner">
        <cves-os-tabs />
        <cves-command-panel />
        <cves-upload-zone />
      </div>
    </div>
  </div>

  @if (state.isExample()) {
    <div class="cves-scan__banner">
      ◈ Catalog preview ({{ state.totalCount() }} CVEs) — upload scan_results.txt to see matches for your system
    </div>
  }

  <div class="cves-scan__main">
    <div class="cves-scan__table">
      <cves-cve-filters />
      <cves-cve-table />
      <p class="cves-scan__meta">
        NVD data · {{ today() }} · No client data stored
      </p>
    </div>
    <cves-cve-sidebar />
  </div>

  @if (state.selectedIds().size > 0) {
    <cves-selection-bar />
  }
  <cves-copyright />
  <cves-seo-crawl />
</section>
