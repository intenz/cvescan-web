<section class="cves-scan">
  <div class="cves-scan__strip" [class.is-collapsed]="state.stripCollapsed()">
    <div class="cves-scan__strip-head">
      <cves-scan-wizard />
      <button
        type="button"
        class="cves-scan__collapse"
        (click)="state.toggleStrip()"
        [attr.aria-expanded]="!state.stripCollapsed()"
      >
        {{ state.stripCollapsed() ? 'Expand' : 'Collapse' }}
      </button>
    </div>

    @if (!state.stripCollapsed()) {
      <cves-os-tabs />
      <cves-command-panel />
      <cves-upload-zone />
    }
  </div>

  @if (state.isExample()) {
    <div class="cves-scan__banner">
      ◈ Catalog preview ({{ state.cves().length }} CVEs) — upload scan_results.txt to see matches for your system
    </div>
  }

  <div class="cves-scan__main" [class.has-sidebar]="state.sidebarOpen()">
    <div class="cves-scan__table">
      <cves-cve-filters />
      <cves-cve-table />
      <p class="cves-scan__meta">
        NVD data · {{ today() }} · No client data stored
      </p>
    </div>
    @if (state.sidebarOpen()) {
      <cves-cve-sidebar />
    }
  </div>

  @if (state.selectedIds().size > 0) {
    <cves-selection-bar />
  }
  <cves-copyright />
</section>
